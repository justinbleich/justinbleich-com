<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Worlds – Justin Bleich</title>
<meta name="description" content="Six small game worlds by Justin Bleich.">
<link rel="icon" href="/favicon.png" type="image/png">
<style>
/* World select. Same type, colour and rhythm as the portfolio home (src/styles.css);
   each world keeps its own palette as a small colour band. */
@import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap");

:root {
  color-scheme: dark;
  --background: #0e1112;
  --text: #fff7f7;
  --muted: #848b91;
  --focus: #d94560;
  --hover: #11bf5e;
  --content-width: 30rem;
  --ease-out: cubic-bezier(0.2, 0, 0, 1);
}

* { box-sizing: border-box; }

html {
  min-height: 100%;
  background: var(--background);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  min-width: 320px;
  min-height: 100svh;
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family: "Instrument Sans", Arial, Helvetica, sans-serif;
  font-size: 16px;
}

h1, p { margin: 0; }

a {
  position: relative;
  color: inherit;
  text-decoration: none;
  transition: color 140ms var(--ease-out);
}
.work-heading a::after {
  position: absolute;
  right: 0;
  bottom: 0.02em;
  left: 0;
  height: 1px;
  background: currentColor;
  content: "";
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 160ms var(--ease-out);
}
a:hover { color: var(--hover); }
.work-heading a:hover::after { transform: scaleX(1); transform-origin: left; }
a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }

.site-shell {
  display: flex;
  min-height: 100svh;
  width: 100%;
  max-width: calc(var(--content-width) + (clamp(28px, 6.8vw, 88px) * 2));
  margin: 0 auto;
  padding: clamp(72px, 9vh, 96px) clamp(28px, 6.8vw, 88px) clamp(32px, 5vh, 56px);
  flex-direction: column;
  justify-content: center;
  gap: 40px;
}

.identity { animation: rise-in 900ms cubic-bezier(0.22, 1, 0.36, 1) both; }
h1, .identity p { font-size: 28px; line-height: 32px; font-weight: 400; text-wrap: balance; }
.identity p, .work-summary { color: var(--muted); }

.work-list {
  display: flex;
  flex-direction: column;
  gap: 32px;
  animation: rise-in 900ms 90ms cubic-bezier(0.22, 1, 0.36, 1) both;
}
.work-heading { display: flex; align-items: center; font-size: 16px; line-height: 24px; white-space: pre; }
.work-summary { font-size: 16px; line-height: 24px; text-wrap: pretty; }

.band { display: flex; width: 72px; height: 6px; margin-left: auto; border-radius: 2px; overflow: hidden; }
.band i { flex: 1; }

/* filled in by shell.js once a world is cleared */
.unlock:not(:empty) { color: var(--text); }
.unlock:not(:empty)::before { content: " · "; color: var(--muted); }

@keyframes rise-in {
  from { opacity: 0; transform: translateY(40px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 560px) {
  .site-shell { padding: 72px 24px 32px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
<link rel="stylesheet" href="/worlds/shell.css">
</head>
<body>
<main class="site-shell" aria-label="Justin Bleich worlds">
  <div class="identity">
    <h1>Justin Bleich</h1>
    <p>Worlds</p>
  </div>

  <div class="work-list" aria-label="Worlds">
    <article class="work-item">
      <p class="work-heading">
        <span>01 → </span><a href="/worlds/world-1">The Run</a>
        <span class="band" aria-hidden="true"><i style="background:#101012"></i><i style="background:#29292e"></i><i style="background:#6c6c72"></i><i style="background:#f1f1ef"></i><i style="background:#f2c14e"></i></span>
      </p>
      <p class="work-summary">A gray 2D platformer<span class="unlock" data-unlock="1"></span></p>
    </article>
    <article class="work-item">
      <p class="work-heading">
        <span>02 → </span><a href="/worlds/world-2">The Gallery</a>
        <span class="band" aria-hidden="true"><i style="background:#2f3d73"></i><i style="background:#e9dfc6"></i><i style="background:#b3302c"></i><i style="background:#f2c14e"></i><i style="background:#231c45"></i></span>
      </p>
      <p class="work-summary">A low-poly hall of paintings<span class="unlock" data-unlock="2"></span></p>
    </article>
    <article class="work-item">
      <p class="work-heading">
        <span>03 → </span><a href="/worlds/world-3">The Diorama</a>
        <span class="band" aria-hidden="true"><i style="background:#f7dfcd"></i><i style="background:#d7c3e3"></i><i style="background:#e2735c"></i><i style="background:#4f9e98"></i><i style="background:#fbf6ef"></i></span>
      </p>
      <p class="work-summary">An isometric puzzle<span class="unlock" data-unlock="3"></span></p>
    </article>
    <article class="work-item">
      <p class="work-heading">
        <span>04 → </span><a href="/worlds/world-4">Grand Prix</a>
        <span class="band" aria-hidden="true"><i style="background:#4fa8ff"></i><i style="background:#5cb94a"></i><i style="background:#4b4e59"></i><i style="background:#e8453c"></i><i style="background:#ff6a2f"></i></span>
      </p>
      <p class="work-summary">A kart race<span class="unlock" data-unlock="4"></span></p>
    </article>
    <article class="work-item">
      <p class="work-heading">
        <span>05 → </span><a href="/worlds/world-5">The Lab</a>
        <span class="band" aria-hidden="true"><i style="background:#3a3d44"></i><i style="background:#eef0f2"></i><i style="background:#8d6bff"></i><i style="background:#c6f04a"></i><i style="background:#16181d"></i></span>
      </p>
      <p class="work-summary">A first-person portal facility<span class="unlock" data-unlock="5"></span></p>
    </article>
    <article class="work-item">
      <p class="work-heading">
        <span>06 → </span><a href="/worlds/world-6">The Library</a>
        <span class="band" aria-hidden="true"><i style="background:#24352f"></i><i style="background:#4a3222"></i><i style="background:#6b2a2a"></i><i style="background:#c9a24a"></i><i style="background:#ece2c8"></i></span>
      </p>
      <p class="work-summary">A point-and-click archive<span class="unlock" data-unlock="6"></span></p>
    </article>
  </div>
</main>
<script src="/worlds/shell.js"></script>
</body>
</html>
