<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html, body { margin: 0; } [hidden] { display: none !important; }</style>
<title>Ashgrove · The Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Layout: full-bleed WebGL room, with the same interface as the reading room:
   place name and keys top left, brass tool buttons top right, a row of place
   chips along the bottom with a caption above it, and paper for anything you read. */
:root {
  --bg: #120b07; --fg: #eadfc6; --text: #eadfc6; --muted: #b9a883; --brass: #d1a850; --brass-deep: #8a6d2f;
  --ember: #e8873a; --veil: rgba(10, 6, 3, 0.80); --panel: #1d130c; --paper: #e8dbbd; --paper-ink: #2b1d11;
  --silver: #c3c9d1; --iron: #7d858e; --ink: #2b1d11; --rule: rgba(234, 223, 198, 0.16);

  /* room palette */
  --w-wall: #24352f; --w-wall-line: #1d2b26; --w-wood: #4a3222; --w-wood-dark: #2e1f15; --w-wood-light: #6b4a31;
  --w-floor: #3a281b; --w-rug: #6b2a2a; --w-ceil: #17110d; --w-stone: #3b3d42; --w-train: #7a2f2a; --w-cream: #e7dcc0; --w-lamp: #ffd88a;

  --display: 'IM Fell English', Georgia, 'Times New Roman', serif;
  --sc: 'IM Fell English SC', Georgia, 'Times New Roman', serif;
  --body: 'Spectral', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: var(--body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }

.frame { position: relative; overflow: hidden; background: var(--bg); }
canvas { display: block; width: 100%; height: 520px; outline: none; touch-action: manipulation; }
.fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 48%, rgba(8,4,2,.5) 100%); }
.arrive { position: absolute; inset: 0; z-index: 30; display: grid; place-items: end center; padding: 2rem; background: #ffe8b0; color: #5a3d1c; font-family: var(--sc); letter-spacing: .12em; transition: opacity 1.6s ease; }
.arrive.gone { opacity: 0; pointer-events: none; }
.fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 1.5rem; text-align: center; color: var(--muted); }

/* top bar: place and keys, tools */
.bar-top { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 30px; background: linear-gradient(to bottom, rgba(10,6,3,.72), rgba(10,6,3,0)); pointer-events: none; }
.bar-top > * { pointer-events: auto; }
.where { display: grid; gap: 8px; min-width: 0; }
.place { font-family: var(--sc); font-size: 16px; letter-spacing: .12em; color: var(--brass); padding-top: 8px; text-shadow: 0 1px 6px #000; }
.inv { display: flex; gap: 6px; }
.slot { width: 34px; height: 34px; display: grid; place-items: center; border: 1px dashed var(--brass-deep); border-radius: 2px; background: rgba(18,11,7,.5); color: transparent; }
.slot svg { width: 22px; height: 22px; }
.slot[data-on="true"] { border-style: solid; border-color: currentColor; }
.slot[data-on="true"][data-k="brass"] { color: var(--brass); }
.slot[data-on="true"][data-k="silver"] { color: var(--silver); }
.slot[data-on="true"][data-k="iron"] { color: var(--iron); }
.tools { display: flex; gap: 8px; flex-shrink: 0; }
.ghost { font-family: var(--sc); font-size: 13px; letter-spacing: .1em; min-height: 40px; padding: 0 12px; color: var(--text);
  background: rgba(18,11,7,.62); border: 1px solid var(--brass-deep); border-radius: 2px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.ghost[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
.frame[data-mode="ride"] .bar-top, .frame[data-mode="ride"] .nav { display: none; }

/* caption + place chips */
.caption { position: absolute; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 78px); margin: 0 auto; max-width: 36ch; text-align: center;
  font-style: italic; font-size: 17px; line-height: 1.4; text-wrap: balance; color: var(--text); text-shadow: 0 1px 8px #000, 0 0 18px #000;
  opacity: 0; transition: opacity .6s; pointer-events: none; }
.caption.show { opacity: 1; }
.nav { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px;
  padding: 30px 12px calc(env(safe-area-inset-bottom, 0px) + 14px); background: linear-gradient(to top, rgba(10,6,3,.8), rgba(10,6,3,0)); pointer-events: none; }
.nav button { pointer-events: auto; font-family: var(--sc); font-size: 14px; letter-spacing: .06em; min-height: 44px; min-width: 44px; padding: 0 10px; color: var(--brass);
  background: rgba(18,11,7,.7); border: 1px solid var(--brass-deep); border-radius: 2px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.nav button[aria-current="true"] { background: var(--brass); color: var(--bg); border-color: var(--brass); }
.nav button.step { color: var(--text); }

/* veils and panels */
.veil { position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; overflow: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--veil); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.panel { width: min(100%, 440px); min-width: 0; }
.eyebrow { font-family: var(--sc); font-size: 13px; letter-spacing: .16em; color: var(--brass); margin: 0 0 10px; }
h1 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.05; text-wrap: balance; font-size: clamp(34px, 10vw, 46px); }
.panel p { font-size: 17px; line-height: 1.55; color: var(--muted); margin: 14px 0 0; }
.panel p.small { font-size: 14px; font-style: italic; }
.btn { font-family: var(--sc); font-size: 15px; letter-spacing: .1em; min-height: 46px; padding: 0 22px; background: var(--brass); color: var(--bg); border: 0; border-radius: 2px; margin-top: 22px; }
.btn[disabled] { opacity: .6; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* anything you read is a sheet of paper, as in the reading room */
.paper { background: linear-gradient(160deg, #eee2c6, #dccba5); color: var(--paper-ink); padding: 30px 26px 24px; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
.paper p { font-family: var(--display); font-size: 19px; line-height: 1.55; color: var(--paper-ink); margin: 0 0 .9em; }
.paper .title { font-family: var(--sc); font-size: 14px; letter-spacing: .14em; color: #6b5433; margin: 0 0 1.2em; padding-bottom: .7em; border-bottom: 1px solid rgba(43,29,17,.25); }
.paper .head { font-style: italic; }
.paper .folio { display: none; }
.paper .pages { font-family: var(--sc); font-size: 13px; letter-spacing: .12em; color: #6b5433; text-align: center; margin: 1em 0 0; }
.paper .btn { background: var(--paper-ink); color: var(--paper); margin-top: 12px; }
.paper .btn.alt { background: transparent; color: var(--paper-ink); border: 1px solid rgba(43,29,17,.45); }
.paper .btn[disabled] { opacity: .3; }
.hollow { display: grid; place-items: center; gap: 12px; margin: .4em 0 1em; padding: 22px 16px; background: #cdbd97; box-shadow: inset 0 3px 12px rgba(0,0,0,.5); text-align: center; }
.hollow svg { width: 72px; height: 72px; }
.hollow p { margin: 0; }
.hollow .btn { margin-top: 0; }

@media (max-width: 40rem) { .bar-top { padding-top: calc(env(safe-area-inset-top, 0px) + 56px); } }
@media (prefers-reduced-motion: reduce) { .fade, .caption { transition: none; } }
</style>

<body data-world="6">
<div class="page">
  <main>
    <section aria-label="Library">
      <div class="frame" id="frame">
        <canvas id="c" tabindex="0" aria-label="A library. Click shelves, the cabinet and the desk to look closer; arrow keys turn, step forward and step back. Find each volume, read a couple of pages to find the key inside, and use the last key to open the way down to the train."></canvas>
        <div class="vignette"></div>
        <header class="bar-top">
          <div class="where">
            <div class="place" id="place">Entrance</div>
            <div class="inv" aria-label="Keys">
              <span class="slot" data-k="brass" title="Brass key"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 12h10M17 12v4M20.5 12v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
              <span class="slot" data-k="silver" title="Silver key"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 12h10M17 12v4M20.5 12v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
              <span class="slot" data-k="iron" title="Iron key"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="7" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11 12h10M17 12v4M20.5 12v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></span>
            </div>
          </div>
          <div class="tools">
            <button class="ghost" id="hint-btn" type="button">Hint</button>
            <button class="ghost" id="sound-btn" type="button" aria-pressed="true">Sound</button>
          </div>
        </header>
        <p class="caption" id="caption" aria-live="polite"></p>
        <nav class="nav" id="nav" aria-label="Places in the room"></nav>
        <div class="fade" id="fade"></div>
        <div class="arrive" id="arrive" hidden><span id="arrive-text">Climbing the stair…</span></div>
        <section class="veil" id="reader" hidden role="dialog" aria-modal="true" aria-labelledby="book-title">
          <div class="panel paper" id="book">
            <p class="title" id="book-title"></p>
            <div id="leaf-l"></div>
            <div id="leaf-r"></div>
            <p class="pages" id="book-pages"></p>
            <div class="row">
              <button class="btn alt" id="pg-prev" type="button">Back a page</button>
              <button class="btn" id="pg-next" type="button">Turn the page</button>
              <button class="btn alt" id="book-close" type="button">Close</button>
            </div>
          </div>
        </section>
        <section class="veil" id="start">
          <div class="panel">
            <p class="eyebrow">World 6 · Chapter two</p>
            <h1>The Archive</h1>
            <p>Every world has a volume here. Find one, read a couple of pages, and take what is hidden inside.</p>
            <p class="small">Click anything to look closer. Arrow keys turn and step.</p>
            <button class="btn" id="start-btn" type="button">Step inside</button>
          </div>
        </section>
        <div class="fail" id="fail" hidden><p>This world needs WebGL, which this browser has turned off.</p></div>
      </div>
    </section>
  </main>
</div>

      placeOnRide(0);
      S.mode = 'ride'; S.rideT = 0; fadeEl.style.opacity = 0; rideMood(true);
    }, reduce ? 50 : 650);
  }
  var rideAhead = new THREE.Vector3();
  function placeOnRide(u) {
    ridePath.getPointAt(u, camera.position);
    ridePath.getPointAt(Math.min(1, u + 0.03), rideAhead);
    camera.lookAt(rideAhead);
    rideLight.position.copy(camera.position); rideLight.target.position.copy(rideAhead);
    /* park the pooled lights at the lamp stations around the train */
    var k0 = Math.floor(u / LAMP_STEP) - 1;
    ridePool.forEach(function (l, i) {
      var uk = Math.min(0.999, Math.max(0, (k0 + i) * LAMP_STEP));
      ridePath.getPointAt(uk, l.position); l.position.y += 0.25 * RIDE_SCALE;
    });
  }
  function arrive() {
    S.mode = 'done'; fadeEl.style.opacity = 1;
    window.BW.complete({
      note: 'Three volumes · three keys · one train',
      stayLabel: 'Back to the library',
      onClose: function () { S.mode = 'play'; frame.removeAttribute('data-mode'); rideMood(false); snap('platform'); fadeEl.style.opacity = 0; setTimeout(function () { fadeEl.style.background = ''; }, 600); try { canvas.focus({ preventScroll: true }); } catch (e) {} }
    });
  }

  /* ---------- input ---------- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  ray.layers.enable(1);
  function pick(e) {
    var r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.intersectObjects(clickables, false).filter(function (h) { return h.object.visible; });
  }
  function here(node) { return node === cur; }
  function blocked() { return !S.started || move || open || S.mode !== 'play' || (window.BW && window.BW.isOpen()); }
  var down = null;
  canvas.addEventListener('pointerdown', function (e) { down = { x: e.clientX, y: e.clientY }; startAudio(); });
  canvas.addEventListener('pointerup', function (e) {
    if (!down || Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) > 10) { down = null; return; }
    down = null;
    if (blocked()) return;
    var hits = pick(e);
    for (var i = 0; i < hits.length; i++) {
      var u = hits[i].object.userData;
      if (!here(u.node)) { goTo(u.node); return; }
      if (u.act) { u.act(); return; }
    }
  });
  var hoverRaf = 0;
  canvas.addEventListener('pointermove', function (e) {
    if (hoverRaf || e.pointerType === 'touch') return;
    hoverRaf = requestAnimationFrame(function () {
      hoverRaf = 0;
      if (blocked()) { canvas.style.cursor = 'default'; return; }
      var hits = pick(e), label = '';
      for (var i = 0; i < hits.length; i++) {
        var u = hits[i].object.userData;
        if (!here(u.node) || u.act) { label = u.label; break; }
      }
      canvas.style.cursor = label ? 'pointer' : 'default';
      canvas.title = label;
    });
  });
  window.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (window.BW && window.BW.isOpen()) return;
    if (open) {
      if (e.code === 'ArrowRight') { e.preventDefault(); turn(1); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); turn(-1); }
      else if (e.code === 'Escape') { e.preventDefault(); closeBook(); }
      return;
    }
    if (blocked()) return;
    startAudio();
    /* the same keys as the reading room: left and right turn, up steps toward what you
       face, down or Escape steps back, 1-6 jump to a place, H asks for a hint */
    var n = NODES[cur];
    if (e.code === 'ArrowLeft' && n.left) { e.preventDefault(); goTo(n.left); }
    else if (e.code === 'ArrowRight' && n.right) { e.preventDefault(); goTo(n.right); }
    else if (e.code === 'ArrowUp' && cur === 'platform') { e.preventDefault(); board(); }
    else if (e.code === 'ArrowUp' && n.fwd) { e.preventDefault(); goTo(n.fwd); }
    else if ((e.code === 'ArrowDown' || e.code === 'Escape' || e.code === 'Backspace') && n.back) { e.preventDefault(); goTo(n.back); }
    else if (/^Digit[1-9]$/.test(e.code)) { var c = chipList()[+e.code.slice(5) - 1]; if (c) { e.preventDefault(); goTo(c[0]); } }
    else if (e.code === 'KeyH') { e.preventDefault(); say(objective(), 6); }
  });
  document.getElementById('start-btn').addEventListener('click', function () {
    document.getElementById('start').hidden = true; S.started = true; startAudio();
    try { canvas.focus({ preventScroll: true }); } catch (e) {}
  });

  /* ---------- update ---------- */
  var time = 0;
  function update(dt) {
    time += dt;
    if (move) {
      move.t += dt / move.dur;
      var k = ease(Math.min(1, move.t));
      camera.position.lerpVectors(move.fp, move.tp, k);
      camera.quaternion.slerpQuaternions(move.fq, move.tq, k);
      if (move.t >= 1) { var ln = move.line; move = null; buildNav(); if (ln && S.mode === 'play') say(ln); }
    }
    if (S.cabOpen > 0 && S.cabOpen < 1) {
      S.cabOpen = Math.min(1, S.cabOpen + dt / 0.9);
      var c = ease(S.cabOpen); doorL.rotation.y = -1.85 * c; doorR.rotation.y = 1.85 * c; shadowDirty = 2;
    }
    if (S.drawerOpen > 0 && S.drawerOpen < 1) {
      S.drawerOpen = Math.min(1, S.drawerOpen + dt / 0.8);
      drawer.position.z = 0.5 + 0.46 * ease(S.drawerOpen); shadowDirty = 2;
    }
    if (S.shelfOpen > 0 && S.shelfOpen < 1) {
      S.shelfOpen = Math.min(1, S.shelfOpen + dt / 2.2);
      hinge.rotation.y = -1.9 * ease(S.shelfOpen); shadowDirty = 2;
      if (S.shelfOpen >= 1) { doorway.visible = true; NODES.platform.unlocked = true; buildNav(); say('A stairway leads down behind the shelf.', 6); }
    }
    if (S.mode === 'ride') {
      S.rideT += dt;
      var total = reduce ? 2.5 : 8;
      /* slow out of the station, then faster and brighter all the way to the light */
      var rp = Math.min(1, S.rideT / total);
      placeOnRide(0.02 + Math.pow(rp, 1.7) * 0.8);
      if (!reduce) { camera.position.x += Math.sin(time * 23) * 0.012 * rp; camera.position.y += Math.sin(time * 31) * 0.01 * rp; }
      /* the glow builds with speed: lamp glass, the light they throw, and the bloom */
      var glowUp = 1 + rp * rp * 3;
      rideGlass.color.copy(RIDE_GLASS).multiplyScalar(glowUp);
      ridePool.forEach(function (l) { l.intensity = 3.2 * glowUp; });
      rideLight.intensity = 1.2 + rp * 10;
      bloom.strength = 0.75 + rp * rp * 1.4;
      if (rp > 0.72) { fadeEl.style.background = '#ffe9e2'; fadeEl.style.opacity = String((rp - 0.72) / 0.28); }
      if (S.rideT >= total) arrive();
    }
  }

  /* ---------- shadows + post ---------- */
  scene.traverse(function (o) {
    if (!o.isMesh || o.material === ghost) return;
    var m = Array.isArray(o.material) ? o.material[0] : o.material;
    if (m.isMeshBasicMaterial || m.transparent || o.userData.noShadow) return;
    o.castShadow = true; o.receiveShadow = true;
  });
  var composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(2, 2, { type: THREE.HalfFloatType, samples: 4 }));
  composer.addPass(new RenderPass(scene, camera));
  gtao = new GTAOPass(scene, camera, 2, 2);
  gtao.updateGtaoMaterial({ radius: 0.35, distanceExponent: 1.2, thickness: 1, scale: 1.1, samples: 12 });
  gtao.blendIntensity = 0.9;
  composer.addPass(gtao);
  var bloom = new UnrealBloomPass(new THREE.Vector2(2, 2), 0.38, 0.7, 1.0);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());

  /* ---------- sizing + loop ---------- */
  var maxRatio = Math.min(window.devicePixelRatio || 1, 1.5), ratio = maxRatio, wake = 8;
  function resize() {
    var w = frame.clientWidth || 360, h = frame.clientHeight || 520;
    renderer.setPixelRatio(ratio);
    renderer.setSize(w, h, false);
    composer.setPixelRatio(ratio);
    composer.setSize(w, h);
    camera.aspect = w / h;
    /* keep roughly the same width of room in view on tall screens */
    camera.fov = clamp(2 * Math.atan(Math.tan(0.54) * Math.max(1, 1.25 / camera.aspect)) * 180 / Math.PI, 62, 92);
    camera.updateProjectionMatrix();
    wake = 4;
  }
  function draw() {
    if (shadowDirty > 0 && S.mode !== 'ride') { renderer.shadowMap.needsUpdate = true; shadowDirty--; }
    composer.render();
  }
  /* The room is still unless you are moving, something is opening, or the train is
     running, so those are the only times a frame is drawn. */
  function busy() {
    return move || S.mode === 'ride' || shadowDirty > 0 || wake > 0 ||
      (S.cabOpen > 0 && S.cabOpen < 1) || (S.drawerOpen > 0 && S.drawerOpen < 1) || (S.shelfOpen > 0 && S.shelfOpen < 1);
  }
  /* If frames run long while something is moving, step the resolution down once or twice. */
  var slowT = 0, slowN = 0, aoOff = false;
  function adapt(raw) {
    slowT += raw; slowN++;
    if (slowN < 45) return;
    var avg = slowT / slowN; slowT = 0; slowN = 0;
    if (avg > 1 / 40 && ratio > 0.8) { ratio = Math.max(0.8, ratio - 0.25); if (ratio <= 1 && gtao) { aoOff = true; if (S.mode !== 'ride') gtao.enabled = false; } resize(); }
  }
  var last = performance.now();
  function loop(now) {
    var raw = (now - last) / 1000, dt = Math.min(raw, 0.05); last = now;
    update(dt);
    if (busy()) { draw(); if (wake > 0) wake--; if (raw < 0.25) adapt(raw); }
    requestAnimationFrame(loop);
  }
  resize();
  snap('hubN');
  syncKeys();
  draw();
  if (window.ResizeObserver) new ResizeObserver(function () { resize(); draw(); }).observe(frame); else addEventListener('resize', resize);
  if (document.fonts && document.fonts.load) {
    document.fonts.load('600 22px "IM Fell English"').then(function () {
      fontTexs.forEach(function (t) { var c = t.userData.canvas; t.userData.draw(c.getContext('2d'), c.width, c.height); t.needsUpdate = true; });
      wake = 4;
    }, function () {});
  }
  /* prototype shortcut: add ?ride to the address to jump straight to the train */
  if (/[?&]ride\b/.test(location.search)) { startBtn.click(); NODES.platform.unlocked = true; snap('platform'); board(); }
  if (arrived) {
    startBtn.click();
    arriveText.textContent = '';
    arriveEl.classList.add('gone');
    say('The stair comes out in an archive.', 6);
  } else {
    arriveEl.hidden = true;
  }
  requestAnimationFrame(function (t) { last = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
